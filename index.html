<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e10" />
  <title>Golden Limits</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e0e10; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e8e8ea; text-align: center; padding: 24px;
      box-sizing: border-box;
    }
    .wrap { max-width: 420px; }
    .mark { font-size: 28px; font-weight: 700; letter-spacing: .5px; color: #d4af37; margin-bottom: 18px; }
    .msg { font-size: 17px; line-height: 1.55; color: #c7c7cc; }
    .sub { font-size: 14px; color: #8a8a8f; margin-top: 14px; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#d4af37; margin-right:8px; vertical-align:middle; opacity:.9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">GOLDEN&nbsp;LIMITS</div>
    <div class="msg"><span class="dot"></span>Temporarily unavailable</div>
    <div class="sub">We'll be back shortly.</div>
  </div>
</body>
</html>
