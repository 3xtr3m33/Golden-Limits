<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#07090e" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>JARVIS — Golden Limits</title>
<style>
  html{background:#07090e;color-scheme:dark}
  :root{
    --bg:#07090e; --bg2:#0b0e15; --card:#121722; --card2:#172030;
    --border:#222a3a; --border2:#2e3850;
    --gold:#e3b94e; --gold-soft:#f0d089; --gold-dim:#8a7333;
    --blue:#2f86ff; --blue-soft:#7ab4ff; --blue-dim:#1d4f8f;
    --green:#27c281; --green-dim:#16996b; --red:#ef5b5b; --amber:#e8a33d;
    --txt:#e8eaf0; --muted:#8b93a7; --muted2:#5e6678;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg) radial-gradient(1200px 600px at 50% -10%, #11203a 0%, var(--bg) 55%) no-repeat;
    color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
    padding:calc(26px + env(safe-area-inset-top)) 18px calc(56px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:1180px;margin:0 auto}

  header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px}
  .brand h1{font-size:30px;font-weight:800;letter-spacing:.4px}
  .brand h1 span{color:var(--gold)}
  .brand p{font-size:12.5px;color:var(--muted);margin-top:4px;letter-spacing:.4px}
  .hmeta{text-align:right;font-size:12px;color:var(--muted)}
  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;
    background:rgba(227,185,78,.10);color:var(--gold-soft);border:1px solid var(--gold-dim);letter-spacing:.5px}
  .updated{margin-top:8px;color:var(--muted2)}
  .stale{color:var(--amber)}

  .card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--border);
    border-radius:16px;padding:20px;margin-bottom:16px}
  .card > h2{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);
    font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
  .card > h2::after{content:"";flex:1;height:1px;background:var(--border)}

  /* FLAT */
  .flat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0 24px}
  .flat .big{font-size:52px;font-weight:800;letter-spacing:6px;color:var(--muted2)}
  .flat .sub{font-size:13px;color:var(--muted)}

  /* Открытая сделка */
  .trade-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .trade-head .num{font-size:26px;font-weight:800}
  .dirpill{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:1px}
  .dir-long{background:rgba(39,194,129,.13);color:var(--green);border:1px solid var(--green-dim)}
  .dir-short{background:rgba(239,91,91,.13);color:var(--red);border:1px solid #8f3232}
  .kv{font-size:13px;color:var(--muted)} .kv b{color:var(--txt);font-weight:650}
  .tps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
  .tp{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
  .tp .lab{font-size:11px;color:var(--muted);letter-spacing:.6px}
  .tp .v{font-size:21px;font-weight:750;margin-top:5px}
  .tp.hit{border-color:var(--green-dim);background:rgba(39,194,129,.08)}
  .tp.hit .v{color:var(--green)}
  .tp.hit .lab::after{content:" ✓";color:var(--green)}
  .legs{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .leg{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;
    padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px}
  .leg .l{color:var(--muted)}

  /* Лимиты */
  .bars{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .bar .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px}
  .bar .top .l{color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-size:11px}
  .bar .top .r{font-weight:700}
  .track{height:8px;border-radius:999px;background:#1a2030;overflow:hidden;position:relative}
  .fill{height:100%;border-radius:999px;transition:width .4s ease}
  .f-green{background:linear-gradient(90deg,var(--green-dim),var(--green))}
  .f-amber{background:linear-gradient(90deg,#9a6a1c,var(--amber))}
  .f-red{background:linear-gradient(90deg,#8f3232,var(--red))}
  .f-blue{background:linear-gradient(90deg,var(--blue-dim),var(--blue))}
  .bar .note{font-size:11.5px;color:var(--muted2);margin-top:6px}
  .acct{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
    font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .acct b{color:var(--txt);font-weight:600}

  /* Часы */
  .clocks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .clock{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
  .clock .lab{font-size:11.5px;color:var(--muted);letter-spacing:.6px}
  .clock .t{font-size:34px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .clock .at{font-size:11.5px;color:var(--muted2);margin-top:5px}
  .clock.warn .t{color:var(--amber)} .clock.danger .t{color:var(--red)}
  .clock.passed .t{color:var(--muted2);font-size:22px}
  .clocknote{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.55}

  /* Зоны */
  .zones{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .zone{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden}
  .zone::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
  .zone.long::before{background:var(--green)} .zone.short::before{background:var(--red)}
  .zhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .zhead .id{font-size:17px;font-weight:800;letter-spacing:.5px}
  .zhead .zn{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
  .tagpill{margin-left:auto;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.7px}
  .t-risky{background:rgba(232,163,61,.12);color:var(--amber);border:1px solid #7a5518}
  .t-solid{background:rgba(39,194,129,.12);color:var(--green);border:1px solid var(--green-dim)}
  .zlevels{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
    margin:12px 0;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums}
  .zlevels b{color:var(--txt);font-weight:650}
  .zrow{font-size:12.5px;line-height:1.6;margin-bottom:9px;color:var(--muted)}
  .zrow .k{color:var(--muted2);text-transform:uppercase;letter-spacing:.7px;font-size:10.5px;
    display:block;margin-bottom:2px}
  .zrow.inv{color:#d9a0a0}
  .att{font-size:12px;line-height:1.55;color:var(--muted2);background:var(--bg2);
    border:1px solid var(--border);border-left:2px solid var(--amber);
    border-radius:8px;padding:9px 11px;margin-top:10px}

  /* Снятые */
  .retired{display:flex;flex-direction:column;gap:9px}
  .ret{display:flex;gap:12px;font-size:12.5px;line-height:1.55;color:var(--muted2);
    padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:10px}
  .ret .rid{font-weight:750;color:var(--muted);white-space:nowrap;min-width:112px;font-variant-numeric:tabular-nums}

  /* Режим */
  .regime-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .bias{font-size:22px;font-weight:800;letter-spacing:1.5px}
  .ws{font-size:12.5px;color:var(--muted)} .ws b{color:var(--gold);font-weight:750}
  .regime p{font-size:13px;line-height:1.65;color:var(--muted)}

  /* Канал */
  .msgs{display:flex;flex-direction:column;gap:8px}
  .msg{display:flex;gap:12px;align-items:flex-start;font-size:12.5px;line-height:1.5;
    padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:10px}
  .msg .mid{color:var(--muted2);font-variant-numeric:tabular-nums;min-width:46px;font-size:11.5px;padding-top:1px}
  .msg .mk{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
    padding:2px 7px;border-radius:5px;background:#1c2434;color:var(--muted);white-space:nowrap}
  .msg.good{border-left:2px solid var(--green)} .msg.bad{border-left:2px solid var(--red)}
  .msg .mt{flex:1}

  /* Сделки дня */
  .trades{display:flex;flex-direction:column;gap:8px}
  .trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;
    padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:10px}
  .trow .n{font-weight:750;min-width:44px}
  .trow .res{color:var(--muted);flex:1}
  .trow .usd{font-weight:750;font-variant-numeric:tabular-nums}
  .pos{color:var(--green)} .neg{color:var(--red)}

  /* Вопрос */
  .qcard{border-color:var(--gold-dim);background:linear-gradient(160deg,#1b1a13,var(--bg2))}
  .qcard h2{color:var(--gold-soft)} .qcard h2::after{background:var(--gold-dim);opacity:.4}
  .qcard .qt{font-size:15px;font-weight:700;margin-bottom:9px;color:var(--gold-soft)}
  .qcard p{font-size:13px;line-height:1.65;color:var(--muted)}

  footer{text-align:center;font-size:11.5px;color:var(--muted2);margin-top:26px;line-height:1.7}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--border2)}

  @media(max-width:820px){
    .zones,.bars,.clocks{grid-template-columns:1fr}
    .brand h1{font-size:24px} .flat .big{font-size:40px;letter-spacing:4px}
    header{align-items:flex-start} .hmeta{text-align:left}
    .ret{flex-direction:column;gap:4px} .ret .rid{min-width:0}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>JARVIS <span>·</span> Golden Limits</h1>
      <p id="session"></p>
    </div>
    <div class="hmeta">
      <span class="badge">ОПЕРАТИВНАЯ ПАНЕЛЬ</span>
      <div class="updated" id="updated"></div>
    </div>
  </header>

  <section class="card"><h2>Позиция</h2><div id="position"></div></section>
  <section class="card"><h2>Лимиты дня</h2><div id="limits"></div></section>
  <section class="card"><h2>Дедлайны</h2><div id="clocks"></div></section>
  <section class="card"><h2>Режим рынка</h2><div class="regime" id="regime"></div></section>
  <section class="card"><h2>Армед-зоны</h2><div class="zones" id="armed"></div></section>
  <section class="card"><h2>Снято сегодня</h2><div class="retired" id="retired"></div></section>
  <section class="card"><h2>Сделки дня</h2><div class="trades" id="today"></div></section>
  <section class="card"><h2>Хвост канала</h2><div class="msgs" id="channel"></div></section>
  <section class="card qcard" id="qwrap"><h2>Открытый вопрос</h2><div id="question"></div></section>

  <footer>
    Панель обновляется на событиях: вход, TP, закрытие, переразметка зон. Живой цены здесь нет — она в терминале.<br>
    <a href="index.html">Performance dashboard</a>
  </footer>

</div>

<script src="jarvis-data.js"></script>
<script>
(function(){
  var D = window.JARVIS || {};
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
  var fmtUsd = function(v){ return (v >= 0 ? "+$" : "-$") + Math.abs(v).toFixed(2); };

  /* Шапка */
  $("session").textContent = D.session || "";
  (function(){
    var el = $("updated");
    if(!D.updated){ el.textContent = "—"; return; }
    var t = new Date(D.updated);
    var mins = Math.round((Date.now() - t.getTime()) / 60000);
    var ago = mins < 1 ? "только что"
            : mins < 60 ? mins + " мин назад"
            : Math.floor(mins/60) + " ч " + (mins%60) + " мин назад";
    var hhmm = t.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jerusalem"});
    el.innerHTML = "обновлено " + hhmm + " IL · <span class=\"" + (mins > 45 ? "stale" : "") + "\">" + ago + "</span>";
  })();

  /* Позиция */
  (function(){
    var o = D.open;
    if(!o){
      $("position").innerHTML =
        '<div class="flat"><div class="big">FLAT</div>' +
        '<div class="sub">Открытых позиций нет. Обе зоны под наблюдением.</div></div>';
      return;
    }
    var tps = (o.tps||[]).map(function(t,i){
      return '<div class="tp' + (t.hit ? ' hit' : '') + '"><div class="lab">TP' + (i+1) +
             '</div><div class="v">' + t.v + '</div></div>';
    }).join("");
    var legs = (o.legs||[]).map(function(l){
      return '<div class="leg"><span class="l">Leg ' + esc(l.id) + ' · ' + esc(l.role) +
             ' · фил ' + esc(l.fill) + '</span><span>' + esc(l.status) +
             (l.usd != null ? ' · <b class="' + (l.usd>=0?'pos':'neg') + '">' + fmtUsd(l.usd) + '</b>' : '') +
             '</span></div>';
    }).join("");
    $("position").innerHTML =
      '<div class="trade-head"><span class="num">#' + esc(o.n) + '</span>' +
      '<span class="dirpill ' + (o.dir === "LONG" ? "dir-long" : "dir-short") + '">' + esc(o.dir) + '</span>' +
      '<span class="kv">вход <b>' + esc(o.entry) + '</b></span>' +
      '<span class="kv">стоп <b>' + esc(o.sl) + (o.slLabel ? " (" + esc(o.slLabel) + ")" : "") + '</b></span></div>' +
      '<div class="tps">' + tps + '</div>' +
      (legs ? '<div class="legs">' + legs + '</div>' : '');
  })();

  /* Лимиты */
  (function(){
    var L = D.limits; if(!L) return;
    function bar(lab, right, pct, cls, note){
      return '<div class="bar"><div class="top"><span class="l">' + lab + '</span>' +
             '<span class="r">' + right + '</span></div>' +
             '<div class="track"><div class="fill ' + cls + '" style="width:' +
             Math.max(0, Math.min(100, pct)) + '%"></div></div>' +
             (note ? '<div class="note">' + note + '</div>' : '') + '</div>';
    }
    var out = "";
    if(L.pnl < 0){
      var used = L.pnl / L.dailyStop * 100;
      out += bar("Дневной стоп", '<span class="neg">' + fmtUsd(L.pnl) + '</span> из ' + fmtUsd(L.dailyStop),
                 used, used > 70 ? "f-red" : "f-amber",
                 "Достижение стопа — flat и торговля до конца дня закрыта.");
    } else {
      var reach = L.pnl / L.softTarget * 100;
      out += bar("P&L дня против софт-цели", '<span class="pos">' + fmtUsd(L.pnl) + '</span> из ' + fmtUsd(L.softTarget),
                 reach, reach >= 100 ? "f-green" : "f-blue",
                 reach >= 100 ? "Цель взята — режим защиты прибыли."
                              : "Буфер до дневного стопа: " + fmtUsd(L.pnl - L.dailyStop) + ".");
    }
    out += bar("Сделки", L.trades + " из " + L.tradesMax,
               L.trades / L.tradesMax * 100,
               L.trades >= L.tradesMax ? "f-red" : L.trades >= L.tradesMax - 1 ? "f-amber" : "f-green",
               L.trades >= L.tradesMax ? "Лимит исчерпан." : "Осталось " + (L.tradesMax - L.trades) + ".");
    out += bar("Стопы подряд", L.consecSl + " из " + L.consecSlMax,
               L.consecSl / L.consecSlMax * 100,
               L.consecSl >= L.consecSlMax ? "f-red" : L.consecSl > 0 ? "f-amber" : "f-green",
               L.consecSl >= L.consecSlMax ? "Пауза." : "Три подряд — пауза до разбора.");
    out += bar("Риск на сделку", "3 x 0.02 лота", 40, "f-blue", "Полный стоп 80-140 пипсов ≈ $48-84.");

    $("limits").innerHTML = '<div class="bars">' + out + '</div>' +
      '<div class="acct"><span>Счёт: <b>' + esc(L.account) + '</b></span>' +
      '<span>MT5: <b>' + esc(L.mt5) + '</b></span></div>';
  })();

  /* Часы */
  (function(){
    var C = D.clocks || [];
    var host = $("clocks");
    host.innerHTML = '<div class="clocks">' + C.map(function(c,i){
      return '<div class="clock ' + esc(c.tone) + '" id="clk' + i + '">' +
             '<div class="lab">' + esc(c.label) + '</div>' +
             '<div class="t">--:--</div>' +
             '<div class="at">' + new Date(c.at).toLocaleTimeString("ru-RU",
               {hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jerusalem"}) + ' IL</div></div>';
    }).join("") + '</div>' + (D.clockNote ? '<div class="clocknote">' + esc(D.clockNote) + '</div>' : '');

    function tick(){
      C.forEach(function(c,i){
        var el = document.getElementById("clk" + i); if(!el) return;
        var diff = new Date(c.at).getTime() - Date.now();
        var t = el.querySelector(".t");
        if(diff <= 0){ el.classList.add("passed"); t.textContent = "прошло"; return; }
        var h = Math.floor(diff/3600000), m = Math.floor(diff/60000)%60, s = Math.floor(diff/1000)%60;
        t.textContent = (h>0 ? h + ":" + String(m).padStart(2,"0") : String(m)) +
                        ":" + String(s).padStart(2,"0");
      });
    }
    tick(); setInterval(tick, 1000);
  })();

  /* Режим */
  (function(){
    var R = D.regime; if(!R) return;
    var cls = R.bias.indexOf("ЛОНГ") >= 0 ? "pos" : R.bias.indexOf("ШОРТ") >= 0 ? "neg" : "";
    $("regime").innerHTML =
      '<div class="regime-head"><span class="bias ' + cls + '">' + esc(R.bias) + '</span>' +
      (R.watershed ? '<span class="ws">водораздел <b>' + esc(R.watershed) + '</b></span>' : '') + '</div>' +
      '<p>' + esc(R.text) + '</p>';
  })();

  /* Зоны */
  (function(){
    var A = D.armed || [];
    if(!A.length){ $("armed").innerHTML = '<div class="ret">Активных зон нет.</div>'; return; }
    $("armed").innerHTML = A.map(function(z){
      return '<div class="zone ' + (z.dir === "LONG" ? "long" : "short") + '">' +
        '<div class="zhead"><span class="id">' + esc(z.id) + '</span>' +
        '<span class="dirpill ' + (z.dir === "LONG" ? "dir-long" : "dir-short") + '">' + esc(z.dir) + '</span>' +
        '<span class="zn">' + esc(z.zone) + '</span>' +
        '<span class="tagpill ' + (z.tag === "SOLID" ? "t-solid" : "t-risky") + '">' + esc(z.tag) + '</span></div>' +
        '<div class="zlevels"><span>опорная <b>' + esc(z.anchor) + '</b></span>' +
        '<span>стоп <b>' + esc(z.sl) + '</b></span>' +
        '<span>цели <b>' + esc(z.tp1) + ' / ' + esc(z.tp2) + ' / ' + esc(z.tp3) + '</b></span></div>' +
        '<div class="zrow"><span class="k">Вход</span>' + esc(z.trigger) + '</div>' +
        '<div class="zrow inv"><span class="k">Инвалидация</span>' + esc(z.invalid) + '</div>' +
        '<div class="zrow"><span class="k">Почему зона</span>' + esc(z.why) + '</div>' +
        (z.attempts || []).map(function(a){ return '<div class="att">' + esc(a) + '</div>'; }).join("") +
      '</div>';
    }).join("");
  })();

  /* Снятые */
  (function(){
    var R = D.retired || [];
    $("retired").innerHTML = R.length ? R.map(function(r){
      return '<div class="ret"><span class="rid">' + esc(r.id) + ' · ' + esc(r.dir) + ' ' + esc(r.zone) +
             '</span><span>' + esc(r.reason) + '</span></div>';
    }).join("") : '<div class="ret">Снятых зон сегодня нет.</div>';
  })();

  /* Сделки дня */
  (function(){
    var T = D.today || [];
    $("today").innerHTML = T.length ? T.map(function(t){
      return '<div class="trow"><span class="n">#' + esc(t.n) + '</span>' +
             '<span class="dirpill ' + (t.dir === "LONG" ? "dir-long" : "dir-short") + '">' + esc(t.dir) + '</span>' +
             '<span class="res">' + esc(t.entry) + ' — ' + esc(t.result) + '</span>' +
             (t.usd != null ? '<span class="usd ' + (t.usd>=0?'pos':'neg') + '">' + fmtUsd(t.usd) + '</span>' : '') +
             '</div>';
    }).join("") : '<div class="ret">Сделок сегодня нет.</div>';
  })();

  /* Канал */
  (function(){
    var C = D.channel || [];
    var names = {card:"карточка", text:"текст", sticker:"стикер", close:"итог", cancel:"отмена"};
    $("channel").innerHTML = C.map(function(m){
      return '<div class="msg ' + esc(m.tone || "") + '">' +
             '<span class="mid">' + esc(m.id) + '</span>' +
             '<span class="mk">' + esc(names[m.kind] || m.kind) + '</span>' +
             '<span class="mt">' + esc(m.text) + '</span></div>';
    }).join("");
  })();

  /* Вопрос */
  (function(){
    var Q = D.question;
    if(!Q){ $("qwrap").style.display = "none"; return; }
    $("question").innerHTML = '<div class="qt">' + esc(Q.title) + '</div><p>' + esc(Q.text) + '</p>';
  })();
})();
</script>
</body>
</html>
